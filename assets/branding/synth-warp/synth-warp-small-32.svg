  </g>
  <g id="accent" fill="#1FD3F2">
    <path d="M 248,224 L 352,224 C 304,304 288,400 208,424 L 208,264 A 40 40 0 0 1 248,224 Z"/>
    <path d="M 776,800 L 672,800 C 720,720 736,624 816,600 L 816,760 A 40 40 0 0 1 776,800 Z"/>
  </g>
</svg>
