<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Synth Warp — 16 px simplification</title>
  <desc id="description">The carved W on a 64-unit grid with straight carves, so edges land on whole pixels at 16 px.</desc>
  <g id="foundation">
    <rect x="64" y="64" width="896" height="896" rx="184" fill="#101014"/>
  </g>
  <g id="glyph" fill="#FFFFFF">
    <path d="M 192,256 H 320 L 384,576 L 448,384 H 576 L 640,576 L 704,256 H 832 L 736,768 H 608 L 512,576 L 416,768 H 288 Z"/>
  </g>
  <g id="accent" fill="#1FD3F2">
    <path d="M 192,256 H 320 L 192,448 Z"/>
    <path d="M 832,768 H 704 L 832,576 Z"/>
  </g>
</svg>
