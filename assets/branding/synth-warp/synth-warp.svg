<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Synth Warp — app icon</title>
  <desc id="description">Synth fork icon family. Flat near-black plate, transparent surround. The mark is the Synth Warp carved W: a white W with two accent-coloured S-curve carves at its top-left and bottom-right corners. All visible artwork is vector geometry.</desc>
