  </g>
  <g id="accent" fill="#1FD3F2">
    <path d="M 272,240 L 360,240 C 312,312 300,400 224,424 L 224,288 A 48 48 0 0 1 272,240 Z"/>
    <path d="M 752,784 L 664,784 C 712,712 724,624 800,600 L 800,736 A 48 48 0 0 1 752,784 Z"/>
  </g>
</svg>
