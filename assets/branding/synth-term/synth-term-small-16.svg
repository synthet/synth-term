<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Synth Term — 16 px simplification</title>
  <desc id="description">The frame is dropped at 16 px; the >_ prompt alone fills the 64-unit grid so edges land on whole pixels.</desc>
  <defs>
    <linearGradient id="silver" x1="0" y1="0" x2="0.65" y2="1">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.45" stop-color="#C3CFDC"/>
      <stop offset="1" stop-color="#A9B7C6"/>
    </linearGradient>
  </defs>
  <g id="foundation">
    <rect x="64" y="64" width="896" height="896" rx="184" fill="#101014"/>
  </g>
  <g id="glyph" fill="url(#silver)" fill-rule="evenodd">
    <path d="M 192,256 H 384 L 640,512 L 384,768 H 192 L 448,512 Z M 576,640 H 832 V 768 H 576 Z"/>
  </g>
</svg>
